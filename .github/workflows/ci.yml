name: Wide CRT dispatcher regressions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    name: Windows - ${{ matrix.target }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: copy
            ref: c459828c89cb9b3dc244ab9bab2bea152c550479
          - target: integer
            ref: d6f6681c3ee0037b2124dd36777bda2908fb7419
          - target: format
            ref: be8c453ac957befa06bfdb81b25f2ba6165217b0
          - target: path
            ref: 5c0297e9ce869be13bf29dd25931abe9d0304ce6
          - target: integrated
            ref: 6d704b674ed6a48fbd89655804286a9240b09514
          - target: fork
            ref: 9dcca05c6572c855d0ab81805e9b6b00fae20620
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.ref }}
          submodules: true
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: git rev-parse HEAD
      - if: matrix.target != 'fork'
        run: bun run typecheck
      - run: bun test crt-wide-
