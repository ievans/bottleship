name: Native CRT and GDI conformance
run-name: Native CRT and GDI conformance
on:
  workflow_dispatch:
    inputs:
      contribution_ref:
        description: Preparation round
        type: string
        required: true
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Native Windows observations
        shell: pwsh
        run: ./native-probe.ps1
