name: CI
run-name: Contribution gate - ${{ inputs.contribution_ref }}
on:
  workflow_dispatch:
    inputs:
      contribution_ref:
        description: Contribution branch to validate
        required: true
        type: string
      wasm_run:
        description: Existing validation run holding checksum-locked build outputs
        type: string
        default: ""
      rebuild_v86:
        description: Rebuild updated emulator and upload its refreshed lock
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: contribution-gate-${{ inputs.contribution_ref }}
  cancel-in-progress: true
jobs:
  quality-gate:
    name: Quality gate (bun run gate)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NAGA_VERSION: "30.0.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.contribution_ref }}
          submodules: true
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Restore validated integration build outputs
        if: inputs.wasm_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          WASM_RUN: ${{ inputs.wasm_run }}
        run: |
          gh run download "$WASM_RUN" --repo "$GITHUB_REPOSITORY" --name upstream-sync-wasm --dir /tmp/sync-wasm
          tar -xzf /tmp/sync-wasm/upstream-sync-wasm.tar.gz --exclude=tools/build-wasm/wasm.lock.json
      - name: Prepare locked wasm outputs when required
        run: |
          if [ -f tools/build-wasm/wasm.lock.json ]; then
            bun run build:wasm
          fi
      - name: Install pinned emulator toolchain
        if: inputs.rebuild_v86
        run: |
          rustup toolchain install
          sudo apt-get install -y --no-install-recommends clang-18
          sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang
      - name: Rebuild updated emulator and refresh lock
        if: inputs.rebuild_v86
        run: bun tools/build-wasm/build.ts v86 --update
      - name: Cache offline WGSL validator
        id: naga-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/bin/naga
          key: naga-cli-${{ env.NAGA_VERSION }}-${{ runner.os }}
      - name: Install offline WGSL validator
        if: steps.naga-cache.outputs.cache-hit != 'true'
        run: cargo install naga-cli --locked --version ${{ env.NAGA_VERSION }}
      - name: Record tested revision
        run: git rev-parse HEAD
      - name: Quality gate
        run: bun run gate
      - name: Package locked outputs
        if: always() && inputs.rebuild_v86
        run: |
          jq -r '.outputs | keys[]' tools/build-wasm/wasm.lock.json > /tmp/sync-wasm-files.txt
          tar -czf /tmp/upstream-sync-wasm.tar.gz -T /tmp/sync-wasm-files.txt tools/build-wasm/wasm.lock.json
      - name: Upload rebuilt outputs and lock
        if: always() && inputs.rebuild_v86
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: upstream-sync-wasm
          path: /tmp/upstream-sync-wasm.tar.gz
          retention-days: 7
