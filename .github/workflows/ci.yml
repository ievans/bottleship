name: Wide CRT dispatcher regressions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    name: Windows - ${{ matrix.target }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: format
            ref: e33f13210775401e7cde97295fd59417e53f11f1
          - target: path
            ref: 67c41f61e70a8e949325c27c9298af2954662271
          - target: integrated
            ref: c3ed90ab9179437c8dc751bad5aeba5157db80cd
          - target: fork
            ref: 336bcec6503679ef543ec57040f952c4edf05175
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.ref }}
          submodules: true
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: git rev-parse HEAD
      - if: matrix.target != 'fork'
        run: bun run typecheck
      - run: bun test crt-wide-
