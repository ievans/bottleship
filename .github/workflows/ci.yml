name: Wide CRT dispatcher regressions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    name: Windows - ${{ matrix.target }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: copy
            ref: 548ed9b7aac126ba41fabbf8585a77ff3e373d72
          - target: format
            ref: 117586066e8e37e25e0d74c301d515a91545de48
          - target: path
            ref: 4b07a4e5e7c404adc7c6c1bfb1b2be0a84a55c7a
          - target: integer
            ref: e65c0f6b883604cf7d76da3213bc8dbe24e69d9d
          - target: integrated
            ref: 91a673c8454ccd262f42ea7e8ee3a2de9b3b88aa
          - target: fork
            ref: abd9422bafbd18d61d01859dafe83fcbd4e7c862
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.ref }}
          submodules: true
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: git rev-parse HEAD
      - if: matrix.target != 'fork'
        run: bun run typecheck
      - run: bun test crt-wide-
