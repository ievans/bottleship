name: CI
run-name: Contribution gate - ${{ inputs.contribution_ref }}
on:
  workflow_dispatch:
    inputs:
      contribution_ref:
        description: Contribution branch to validate
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: contribution-gate-${{ inputs.contribution_ref }}
  cancel-in-progress: true
jobs:
  quality-gate:
    name: Quality gate (bun run gate)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NAGA_VERSION: "30.0.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.contribution_ref }}
          submodules: true
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Cache offline WGSL validator
        id: naga-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/bin/naga
          key: naga-cli-${{ env.NAGA_VERSION }}-${{ runner.os }}
      - name: Install offline WGSL validator
        if: steps.naga-cache.outputs.cache-hit != 'true'
        run: cargo install naga-cli --locked --version ${{ env.NAGA_VERSION }}
      - name: Record tested revision
        run: git rev-parse HEAD
      - name: Quality gate
        run: bun run gate
