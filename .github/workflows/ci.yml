name: Fork mirror Windows regressions
on:
  workflow_dispatch:
    inputs:
      contribution_ref:
        required: true
        type: string
permissions:
  contents: read
jobs:
  focused:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.contribution_ref }}
          submodules: true
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: git rev-parse HEAD
      - run: bun test tools/tests/crt-wide-copy.test.ts tools/tests/crt-wide-format.test.ts tools/tests/crt-wide-path.test.ts tools/tests/crt-wide-integer.test.ts tools/tests/crt-wide-secure.test.ts tools/tests/inno-registry-values.test.ts tools/tests/manifest-synth.test.ts
