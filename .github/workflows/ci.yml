name: Native integer and width observations
on:
  workflow_dispatch:
    inputs:
      contribution_ref:
        required: true
        type: string
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - shell: pwsh
        run: ./native-probe.ps1
  focused:
    name: Windows - ${{ matrix.slug }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: inno-directories
            ref: a2676589
            tests: tools/tests/inno-directory-manifest.test.ts
          - slug: inno-registry-types
            ref: 6dd3a8eb
            tests: tools/tests/inno-registry-values.test.ts
          - slug: crt-wide-integer
            ref: 3e9d41d3
            tests: tools/tests/crt-wide-integer.test.ts
          - slug: gdi-char-widths
            ref: 36e2e6e7
            tests: tools/tests/gdi-char-width-variants.test.ts tools/tests/gdi-char-widths-ansi.test.ts
          - slug: integrated
            ref: 3c587b31
            tests: tools/tests/inno-directory-manifest.test.ts tools/tests/inno-registry-values.test.ts tools/tests/crt-wide-integer.test.ts tools/tests/gdi-char-width-variants.test.ts tools/tests/gdi-char-widths-ansi.test.ts tools/tests/crt-wide-copy.test.ts tools/tests/crt-wide-format.test.ts tools/tests/crt-wide-path.test.ts tools/tests/gdi-brush-styles.test.ts tools/tests/gdi-whole-text-cache.test.ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.ref }}
          submodules: true
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: git rev-parse HEAD
      - run: bun run typecheck
      - run: bun test ${{ matrix.tests }}
