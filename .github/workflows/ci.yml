name: Wide CRT dispatcher regressions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    name: Windows - ${{ matrix.target }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: copy
            ref: 82a1497204acb1a267d5eb331f7ab9f15f900d32
          - target: integer
            ref: 94b8b2e5648895d45a735bc49bf8cc6026b2185d
          - target: format
            ref: 08bdd05f75970db2d4b60178f9af6fc55728c97b
          - target: path
            ref: 884d4219a4f6a748c776a528db932e154b041d7a
          - target: integrated
            ref: ed524d6ccf94d29a216eb19538dbfaad2b900c00
          - target: fork
            ref: b640773a3121d4139621967008e866dc3557f3e5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.ref }}
          submodules: true
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: git rev-parse HEAD
      - if: matrix.target != 'fork'
        run: bun run typecheck
      - run: bun test crt-wide-
