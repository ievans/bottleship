name: CI

on:
  push:
    # This repo's default branch is `main` and work lands on `develop`; there is no `master`,
    # so the push job used to never run.
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# Least privilege: only publish-wasm writes to the repo, and only its own job gets that.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality gate (bun run gate)
    # Pinned image: the clang that compiles v86's zstd object is part of the wasm lock.
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      # Must match the `=` pin in tools/build-unpack-buffered/Cargo.toml.
      WASM_BINDGEN_VERSION: "0.2.123"
      # Pinned so a naga release cannot change what CI validates without a commit, and so the
      # cache key below is meaningful.
      NAGA_VERSION: "30.0.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # vendor/v86 is a file: dependency of package.json — bun install needs
          # the submodule checked out even though the gate never builds it.
          submodules: true
          persist-credentials: false
          # NOT the default depth of 1. checkout passes fetch-depth straight through as
          # `git submodule update --depth=N`, and a shallow submodule fetch brings only the
          # submodule's DEFAULT branch (master); our gitlink lives on `bottleship`, so checkout
          # falls back to asking for the bare SHA and the server refuses it ("not our ref").
          # Full depth also gives validate-jit-exports the submodule history its staleness
          # check reads — shallow, that check finds no commits and passes vacuously.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Toolchains behind tools/build-wasm/wasm.lock.json: rustc from rust-toolchain.toml, clang 18.
      - name: Install pinned wasm toolchain
        run: |
          rustup toolchain install
          sudo apt-get install -y --no-install-recommends clang-18
          sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang

      - name: Cache wasm-bindgen CLI
        id: wasm-bindgen-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ env.WASM_BINDGEN_VERSION }}-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Install wasm-bindgen CLI
        if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --locked --version ${{ env.WASM_BINDGEN_VERSION }}

      # The FFmpeg build is slow. The cached file is only used when it matches the lock; otherwise
      # build:wasm rebuilds it.
      - name: Cache video decoder
        uses: actions/cache@v6
        with:
          path: public/video-decoder.wasm
          key: video-decoder-${{ hashFiles('tools/build-ffmpeg-decoder/**', 'tools/build-wasm/**') }}

      # CI builds what it publishes, so it must never download its own release.
      - name: Build wasm (verified against tools/build-wasm/wasm.lock.json)
        env:
          BS_WASM_NO_DOWNLOAD: "1"
        run: bun run build:wasm

      - name: Cache offline WGSL validator
        id: naga-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/naga
          key: naga-cli-${{ env.NAGA_VERSION }}-${{ runner.os }}

      - name: Install offline WGSL validator
        if: steps.naga-cache.outputs.cache-hit != 'true'
        run: cargo install naga-cli --locked --version ${{ env.NAGA_VERSION }}

      # THE canonical quality gate (CLAUDE.md §4) — the whole ordered list, not a subset.
      # Running the `gate` script rather than re-listing the steps is what keeps this file
      # from drifting away from the definition it claims to run; the gate itself sets
      # BS_REQUIRE_WGSL_VALIDATOR for the validator report and the test suite.
      - name: Quality gate
        run: bun run gate

      # Only a build that passed the gate is handed to publish-wasm.
      - name: Package wasm outputs
        if: github.ref == 'refs/heads/main'
        run: jq -r '.outputs | keys[]' tools/build-wasm/wasm.lock.json | tar -czf wasm.tar.gz -T -

      - name: Keep wasm outputs for publishing
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wasm-outputs
          path: wasm.tar.gz
          retention-days: 1

  # Builders without the wasm toolchains download these instead of compiling. The release is keyed
  # to the lock, so every commit with the same lock shares one. Anyone who downloads it can verify
  # it: `bun run build:wasm` accepts only files that match the lock.
  publish-wasm:
    name: Publish wasm outputs
    needs: quality-gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: wasm-outputs

      - name: Create the release for this lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="wasm-$(sha256sum tools/build-wasm/wasm.lock.json | cut -c1-16)"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG already exists"
            exit 0
          fi
          gh release create "$TAG" wasm.tar.gz \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "Wasm outputs matching tools/build-wasm/wasm.lock.json at $GITHUB_SHA." \
            --prerelease

  dedup-scan:
    name: Dedup / dead-export scan (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Advisory only — findings are triage input (release-triage §11.1), not a gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Same submodule contract as the gate job above.
          submodules: true
          persist-credentials: false
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Copy/paste detector (jscpd)
        run: >
          bun run jscpd src
          --min-tokens 120 --min-lines 10
          --reporters consoleFull
          --ignore "**/*.generated.ts,**/index.ts"
          --threshold 100

      - name: Dead exports (ts-prune)
        run: bun run ts-prune -p tsconfig.json || true
