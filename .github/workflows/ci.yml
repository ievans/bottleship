name: Wide CRT dispatcher regressions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    name: Windows - ${{ matrix.target }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: copy
            ref: 7dc1911ca60fbb4bdf4b783f87f8399223cb20a4
          - target: integer
            ref: 2153ab2a7af0f73bcec1e7cf748cae82268b12bb
          - target: format
            ref: 4dbbe687bcec5f878576469f32a3272eda642f15
          - target: path
            ref: 8f4ae24ecac1ddee6ceb81a12edbabe4b615ced0
          - target: integrated
            ref: bcba77cc78a9cc1fad8a0768986adb5ba41052f2
          - target: fork
            ref: deb13450e1f33391ea34d98b8d75d145246db509
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.ref }}
          submodules: true
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: git rev-parse HEAD
      - if: matrix.target != 'fork'
        run: bun run typecheck
      - run: bun test crt-wide-
