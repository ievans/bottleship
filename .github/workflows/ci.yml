name: CRT review native observations
on:
  workflow_dispatch:
    inputs:
      contribution_ref:
        required: true
        type: string
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - shell: pwsh
        run: ./native-probe.ps1
