name: Upstream sync validation
run-name: Upstream sync - ${{ inputs.sync_ref }}
on:
  workflow_dispatch:
    inputs:
      sync_ref:
        description: Merge branch to build and validate
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sync_ref }}
          submodules: true
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Restore existing locked outputs
        run: bun run build:wasm
      - name: Install pinned emulator toolchain
        run: |
          rustup toolchain install
          sudo apt-get install -y --no-install-recommends clang-18
          sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang
      - name: Rebuild updated emulator and refresh its lock
        run: bun tools/build-wasm/build.ts v86 --update
      - name: Cache offline shader validator
        id: naga
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/bin/naga
          key: naga-cli-30.0.1-${{ runner.os }}
      - name: Install offline shader validator
        if: steps.naga.outputs.cache-hit != 'true'
        run: cargo install naga-cli --locked --version 30.0.1
      - name: Record tested revision
        run: git rev-parse HEAD
      - name: Quality gate
        run: bun run gate
      - name: Package locked outputs
        if: always()
        run: |
          jq -r '.outputs | keys[]' tools/build-wasm/wasm.lock.json > /tmp/sync-wasm-files.txt
          tar -czf /tmp/upstream-sync-wasm.tar.gz -T /tmp/sync-wasm-files.txt tools/build-wasm/wasm.lock.json
      - name: Upload rebuilt outputs and lock
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: upstream-sync-wasm
          path: /tmp/upstream-sync-wasm.tar.gz
          retention-days: 7
