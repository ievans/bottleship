name: PR title

# A squash merge uses the PR title as the commit message, and release-please reads those messages
# to choose the next version and write CHANGELOG.md, so a title must be a Conventional Commit
# (CONTRIBUTING.md, "Releases").
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    name: Conventional Commit title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
